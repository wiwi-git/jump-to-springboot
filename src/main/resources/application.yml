spring:
  application:
    name: sbb
  profiles:
    active: dev
  mvc:
    hiddenmethod:
      filter:
        enabled: true # 폼의 _method 파라미터(DELETE 등)를 실제 HTTP 메서드로 바꿔 준다
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        use_sql_comments: true
logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
